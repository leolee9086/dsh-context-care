# Place the consumer inside the SAME isolated compaction group as the backend.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: context-care
      name: dsh-context-care/agent
      config:
        budgetRatio: 0.8
        wakefulnessRatio: 0.3333333333333333
        fatigueExponent: 1.5
        retainRatio: 0.16
        minFreshTokens: 1024
        # 交接笔记上限 10000（v0.6.1 起为源码默认值）。
        # 这里若显式写小数字，会把源码默认值盖掉 —— 曾经写成 4000，导致改动不生效。
        maxNoteChars: 10000
