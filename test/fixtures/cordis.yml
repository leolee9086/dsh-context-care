- name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 0
- name: '@deepseek-ai/dsh-storage'
- name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js ctx.get('contextCareTestRoot')
- name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- name: 'dsh-context-care/completion'
  disabled: !!js "!ctx.get('contextCareTestCompletion')"
  config: !!js ctx.get('contextCareTestCompletionConfig')
- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-session-projection'
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- name: '@deepseek-ai/dsh-compaction-image-offload'
- name: '@deepseek-ai/dsh-token-meter'
- name: '@deepseek-ai/dsh-compaction-basic'
  config:
    auto: false
- name: 'dsh-context-care/requests'
- name: 'dsh-context-care'
  config: !!js >-
    ({ retainRatio: 0.01, minFreshTokens: 100, ...ctx.get('contextCareTestConfig') })
